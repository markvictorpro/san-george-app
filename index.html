<!DOCTYPE html>
<html lang="ar">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/san-george-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="San George">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="San George">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>San George</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#526B56">
  <style>body{background:#F4EFE8}</style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // iPhone Safari only shows live camera video inside the page when the video element is
    // marked playsinline (and muted). The barcode scanner plugin creates its video element
    // without these, which leaves an empty screen, so set them just before any video plays.
    (function () {
      var play = HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play = function () {
        if (this instanceof HTMLVideoElement) {
          this.muted = true;
          this.playsInline = true;
          this.setAttribute('muted', '');
          this.setAttribute('playsinline', '');
          this.setAttribute('webkit-playsinline', '');
          this.setAttribute('autoplay', '');
        }
        return play.apply(this, arguments);
      };
    })();
  </script>
  <script>
    // Offline support: sw.js (written by scripts/build_web.sh) keeps the app's files. A new build
    // is cached in the background and used from the next time the app is opened, never by
    // reloading in the middle of work.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
